# Keep memory use predictable; Compose/Kotlin builds are heap-heavy.
# Sized for a 4 GB build host: the Gradle JVM plus the in-process Kotlin
# compiler must stay well under the host's memory so the kernel never has to
# pick a victim. Raise only on a machine with more headroom.
org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
